[package]
name = "recorder-core"
version = "0.1.0"
edition = "2021"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
cosmic-text = "0.19.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "0.37", default-features = false, features = ["system", "disk"] }
thiserror = "2"
tiny-skia = "0.12.0"
tokio = { version = "1", features = ["process", "time", "io-util", "sync", "rt-multi-thread", "macros", "fs", "net"] }

[dev-dependencies]
tempfile = "3"
